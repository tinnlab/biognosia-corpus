################################################################################
# Reference database configuration
#
# Read by scripts/01_init_reference_db.sh and src/db_init/.
# ${VAR:-default} takes the value from the environment (or .env) when it is set.
################################################################################

DATA_DIR="${DATA_DIR:-$PROJECT_ROOT/data}"
MODEL_CACHE_DIR="${MODEL_CACHE_DIR:-$DATA_DIR/models}"
RESOURCE_DIR="$DATA_DIR/resources"

################################################################################
# GENE INSERTION SETTINGS
################################################################################

# Input file path
GENE_INFO_FILE="$RESOURCE_DIR/genes/gene_info.gz"

# Filtering options
# Filter by taxonomy ID(s) - comma-separated (e.g., "9606" for human, "10090" for mouse)
# Leave empty to include all organisms
GENE_FILTER_TAXID=""

# Filter by gene type(s) - comma-separated
# Common types: protein-coding, ncRNA, tRNA, rRNA, snRNA, snoRNA, misc_RNA, pseudo
# Leave empty to include all gene types
GENE_FILTER_TYPE="protein-coding"

# Processing batch size
GENE_BATCH_SIZE=10000

# Limit number of genes to process (0 = no limit)
GENE_LIMIT=0

################################################################################
# DATABASE CONNECTION SETTINGS
################################################################################

# Milvus connection
MILVUS_HOST="${MILVUS_HOST:-localhost}"
MILVUS_PORT="${MILVUS_PORT:-19530}"

# Milvus batch insert size
# Number of entities to insert per batch
MILVUS_BATCH_SIZE=5000

################################################################################
# RESOURCE ALLOCATION
################################################################################

# GPU devices to use (comma-separated GPU IDs for CUDA_VISIBLE_DEVICES)
# Examples: "0,1,2,3" for GPUs 0-3, "0,2" for GPUs 0 and 2, or "" for CPU-only
# This sets CUDA_VISIBLE_DEVICES, so workers see these as cuda:0, cuda:1, etc.
CUDA_VISIBLE_DEVICES="${CUDA_VISIBLE_DEVICES:-0}"

# Number of parallel workers for embedding generation
WORKERS=4

# Maximum number of batches in pending buffer before pausing embedding
MAX_PENDING_BATCHES=10

################################################################################
# EMBEDDING SETTINGS
################################################################################

# Model for generating content embeddings (full descriptions)
# Options: "BAAI/bge-m3" (1024-dim), "ncbi/MedCPT-Query-Encoder" (768-dim)
EMBEDDING_MODEL="BAAI/bge-m3"

# Embedding dimension (must match model)
EMBEDDING_DIM=1024

# Model for generating label embeddings (entity names/symbols only)
# Used for entity recognition - matching short entity names
LABEL_EMBEDDING_MODEL="ncbi/MedCPT-Query-Encoder"

# Label embedding dimension
LABEL_EMBEDDING_DIM=768

# Maximum sequence length for content embeddings
MAX_LENGTH_CONTENT=2048

# Maximum sequence length for label embeddings
# Used for entity names/symbols only
# Keep this short since labels are typically brief
MAX_LENGTH_LABEL=512

# Sub-batch size for embedding generation per worker
# Each worker processes this many texts at once
EMBEDDING_SUB_BATCH_SIZE=64

################################################################################
# WORKSPACE
################################################################################

WORKSPACE="lightrag"

# Graph field separator
GRAPH_FIELD_SEP="<SEP>"

################################################################################
# METADATA TRACKING
################################################################################

# Directory for insertion metadata files
METADATA_DIR="$DATA_DIR/db-init"

# Metadata file for gene insertions
GENE_METADATA_FILE="gene.csv"

# Metadata file for gene2go insertions
GENE2GO_METADATA_FILE="gene2go.csv"

################################################################################
# GENE2GO INSERTION SETTINGS
################################################################################

# Input file paths
GENE2GO_FILE="$RESOURCE_DIR/genes/gene2go.gz"

# Filtering options
# Filter by taxonomy ID(s) - comma-separated (same as gene filtering)
GENE2GO_FILTER_TAXID=""

# Filter by GO Category - comma-separated
# Categories: Function, Process, Component
# Leave empty to include all categories
GENE2GO_FILTER_CATEGORY=""

# Processing batch size
GENE2GO_BATCH_SIZE=10000

# Limit number of gene2go records to process (0 = no limit)
GENE2GO_LIMIT=0

# Skip GO terms insertion (true/false)
# Set to "true" to skip dropping and inserting entities_Gene_Ontology
GENE2GO_SKIP_GO_TERMS="false"

# Skip relationships insertion (true/false)
# Set to "true" to skip dropping and inserting relationships_Gene_Gene_Ontology
GENE2GO_SKIP_RELATIONSHIPS="false"

################################################################################
# KEGG PATHWAY INSERTION SETTINGS
################################################################################

# KEGG organism codes (comma-separated)
# Common codes: hsa=human, mmu=mouse, rno=rat, dme=fly, cel=worm, sce=yeast
# Leave empty to process ALL organisms, or specify specific organisms (e.g., "hsa" for human only)
KEGG_ORGANISMS="hsa,mmu,rno"

# Processing batch size for pathways
KEGG_BATCH_SIZE=100

# Limit number of pathways to process (0 = no limit)
KEGG_LIMIT=0

# KEGG cache directory
KEGG_CACHE_DIR="$DATA_DIR/db-init/kegg-cache"

# KEGG cache validity in days
# Cached API responses older than this will be refreshed
KEGG_CACHE_DAYS=30

# Skip pathway entities insertion (true/false)
# Set to "true" to skip dropping and inserting entities_KEGG_Pathway
KEGG_SKIP_PATHWAYS="false"

# Skip relationships insertion (true/false)
# Set to "true" to skip dropping and inserting relationships_Gene_KEGG_Pathway
KEGG_SKIP_RELATIONSHIPS="false"

# Metadata file for KEGG pathway insertions
KEGG_METADATA_FILE="kegg_pathways.csv"

################################################################################
# CELL ONTOLOGY INSERTION SETTINGS
################################################################################

# Input file path (OWL/XML format)
CELL_ONTOLOGY_FILE="$RESOURCE_DIR/ontologies/cl.owl"

# Filtering options
# Filter by organism subset(s) - comma-separated
# Common subsets: human_subset, mouse_subset
# Leave empty to include all subsets
CELL_FILTER_SUBSET=""

# Exclude obsolete cell types (true/false)
CELL_EXCLUDE_OBSOLETE="true"

# Processing batch size
CELL_BATCH_SIZE=1000

# Limit number of cell types to process (0 = no limit)
CELL_LIMIT=0

# Metadata file for Cell Ontology insertions
CELL_METADATA_FILE="cell_ontology.csv"

################################################################################
# CTD DISEASE INSERTION SETTINGS
################################################################################

# Input file paths
CTD_DISEASE_FILE="$RESOURCE_DIR/ctd/CTD_diseases.csv.gz"
CTD_DISEASE_GENE_FILE="$RESOURCE_DIR/ctd/CTD_curated_genes_diseases.csv.gz"
CTD_DISEASE_PATHWAY_FILE="$RESOURCE_DIR/ctd/CTD_diseases_pathways.csv.gz"

# Filtering options
# Filter by disease category (comma-separated)
# Common categories: "Endocrine system disease", "Metabolic disease", "Nervous system disease"
# Leave empty to include all categories
CTD_DISEASE_FILTER_CATEGORY=""

# Processing batch size
CTD_DISEASE_BATCH_SIZE=1000

# Limit number of diseases to process (0 = no limit)
CTD_DISEASE_LIMIT=0

# Skip relationship processing
# Set to "true" to skip gene-disease relationships
CTD_DISEASE_SKIP_GENE_DISEASE="false"

# Set to "true" to skip disease-KEGG pathway relationships
CTD_DISEASE_SKIP_KEGG_PATHWAY="false"

# Set to "true" to skip disease-Reactome pathway relationships
CTD_DISEASE_SKIP_REACTOME_PATHWAY="false"

# Metadata file for CTD disease insertions
CTD_DISEASE_METADATA_FILE="ctd_diseases.csv"

################################################################################
# CTD CHEMICAL INSERTION SETTINGS
################################################################################

# Input file paths
CTD_CHEMICAL_FILE="$RESOURCE_DIR/ctd/CTD_chemicals.csv.gz"
CTD_CHEMICAL_GENE_FILE="$RESOURCE_DIR/ctd/CTD_chem_gene_ixns.csv.gz"
CTD_CHEMICAL_DISEASE_FILE="$RESOURCE_DIR/ctd/CTD_curated_chemicals_diseases.csv.gz"
CTD_CHEMICAL_PATHWAY_FILE="$RESOURCE_DIR/ctd/CTD_chem_pathways_enriched.csv.gz"
CTD_CHEMICAL_GO_FILE="$RESOURCE_DIR/ctd/CTD_chem_go_enriched.csv.gz"

# Filtering options
# Filter chemical-gene interactions by organism ID (comma-separated)
# Common IDs: 9606=human, 10090=mouse, 10116=rat
# Leave empty to include all organisms
CTD_CHEMICAL_FILTER_ORGANISM=""

# Filter GO enrichments by ontology (comma-separated)
# Options: "Biological Process", "Cellular Component", "Molecular Function"
# Leave empty to include all ontologies
CTD_CHEMICAL_FILTER_GO_ONTOLOGY=""

# Processing batch size
CTD_CHEMICAL_BATCH_SIZE=1000

# Limit number of chemicals to process (0 = no limit)
CTD_CHEMICAL_LIMIT=0

# Skip relationship processing
# Set to "true" to skip chemical-gene interaction relationships
CTD_CHEMICAL_SKIP_GENE_INTERACTION="false"

# Set to "true" to skip chemical-disease relationships
CTD_CHEMICAL_SKIP_DISEASE="false"

# Set to "true" to skip chemical-KEGG pathway enrichments
CTD_CHEMICAL_SKIP_KEGG_PATHWAY="false"

# Set to "true" to skip chemical-Reactome pathway enrichments
CTD_CHEMICAL_SKIP_REACTOME_PATHWAY="false"

# Set to "true" to skip chemical-GO enrichments
CTD_CHEMICAL_SKIP_GO="false"

# Metadata file for CTD chemical insertions
CTD_CHEMICAL_METADATA_FILE="ctd_chemicals.csv"

################################################################################
# HUGGINGFACE SETTINGS
################################################################################

# HuggingFace token (for model downloads)
HF_TOKEN="${HF_TOKEN:-}"

################################################################################
# UBERON ANATOMY INSERTION SETTINGS
################################################################################

# Input file path (OWL/XML format)
UBERON_FILE="$RESOURCE_DIR/ontologies/uberon.owl"

# Filtering options
# Filter by organism/domain subset(s) - comma-separated
# Common subsets: uberon_slim, vertebrate_core, human_reference_atlas
# Leave empty to include all subsets
UBERON_FILTER_SUBSET=""

# Exclude obsolete anatomy terms (true/false)
UBERON_EXCLUDE_OBSOLETE="true"

# Processing batch size
UBERON_BATCH_SIZE=1000

# Limit number of anatomy terms to process (0 = no limit)
UBERON_LIMIT=0

# Metadata file for UBERON anatomy insertions
UBERON_METADATA_FILE="uberon.csv"

################################################################################
# TAXONOMY INSERTION SETTINGS
################################################################################

# Input directory path
TAXONOMY_DIR="$RESOURCE_DIR/taxonomy"

# Filtering options
# Filter by taxonomic rank(s) - comma-separated
# Common ranks: domain, kingdom, phylum, class, order, family, genus, species, subspecies
# Leave empty to include all ranks
TAXONOMY_FILTER_RANKS=""

# Filter by division ID(s) - comma-separated
# Common division IDs: 0=Bacteria, 1=Invertebrates, 2=Mammals, 3=Phages, 4=Plants,
#                      5=Primates, 6=Rodents, 7=Vertebrates, 8=Viruses
# Leave empty to include all divisions
TAXONOMY_FILTER_DIVISIONS=""

# Processing batch size
TAXONOMY_BATCH_SIZE=5000

# Limit number of taxa to process (0 = no limit)
TAXONOMY_LIMIT=0

# Metadata file for taxonomy insertions
TAXONOMY_METADATA_FILE="taxonomy.csv"

################################################################################
# REACTOME PATHWAY INSERTION SETTINGS
################################################################################

# Input directory path
REACTOME_DIR="$RESOURCE_DIR/reactome"

# Filtering options
# Filter by organism(s) - comma-separated scientific names
# Common organisms: "Homo sapiens", "Mus musculus", "Rattus norvegicus"
# Leave empty to include all organisms
REACTOME_FILTER_ORGANISMS=""

# Processing batch size
REACTOME_BATCH_SIZE=1000

# Limit number of pathways to process (0 = no limit)
REACTOME_LIMIT=0

# Skip pathway entities insertion (true/false)
# Set to "true" to skip dropping and inserting entities_Reactome_Pathway
REACTOME_SKIP_PATHWAYS="false"

# Skip relationships insertion (true/false)
# Set to "true" to skip dropping and inserting relationships_Gene_Reactome_Pathway
REACTOME_SKIP_RELATIONSHIPS="false"

# Metadata file for Reactome pathway insertions
REACTOME_METADATA_FILE="reactome_pathways.csv"

################################################################################
# MSIGDB GENE SET INSERTION SETTINGS
################################################################################

# Input database paths
MSIGDB_DB_HUMAN="$RESOURCE_DIR/msigdb/msigdb_v2025.1.Hs.db"
MSIGDB_DB_MOUSE="$RESOURCE_DIR/msigdb/msigdb_v2025.1.Mm.db"

# Species code ("HS" for human, "MM" for mouse)
MSIGDB_SPECIES="HS"

# Collection filtering
# Filter by collection(s) - comma-separated collection names
# Common collections:
#   H = Hallmark gene sets (50 well-defined biological states)
#   C1 = Positional gene sets (chromosomal locations)
#   C2:CGP = Chemical and genetic perturbations (3,538 sets)
#   C2:CP:REACTOME = Reactome pathways (1,787 sets)
#   C2:CP:KEGG = KEGG pathways
#   C2:CP:WIKIPATHWAYS = WikiPathways
#   C5:GO:BP = Gene Ontology Biological Process (7,583 sets)
#   C5:GO:MF = Gene Ontology Molecular Function (1,855 sets)
#   C5:GO:CC = Gene Ontology Cellular Component (1,042 sets)
#   C5:HPO = Human Phenotype Ontology (5,748 sets)
#   C7:IMMUNESIGDB = Immunologic signatures (4,872 sets)
#   C8 = Cell type signatures (866 sets)
# Leave empty to include all collections
# Examples:
#   MSIGDB_COLLECTIONS="H" (Hallmark only)
#   MSIGDB_COLLECTIONS="H,C2:CP:REACTOME" (Hallmark + Reactome)
#   MSIGDB_COLLECTIONS="" (all collections)
MSIGDB_COLLECTIONS=""

# Processing batch size
MSIGDB_BATCH_SIZE=1000

# Limit number of gene sets to process (0 = no limit)
MSIGDB_LIMIT=0

# Skip gene set entities insertion (true/false)
# Set to "true" to skip dropping and inserting entities_MSigDB_GeneSet
MSIGDB_SKIP_GENE_SETS="false"

# Skip relationships insertion (true/false)
# Set to "true" to skip dropping and inserting relationships_Gene_MSigDB_GeneSet
MSIGDB_SKIP_RELATIONSHIPS="false"

# Metadata file for MSigDB gene set insertions
MSIGDB_METADATA_FILE="msigdb_gene_sets.csv"

