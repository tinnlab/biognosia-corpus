[project]
name = "biognosia-corpus"
version = "0.1.0"
description = "Corpus processing and database insertion for the BioGnosia knowledge base"
requires-python = ">=3.11"

[tool.ruff]
exclude = [".git", "__pycache__", "venv", ".venv", "build", "dist", "data", "database"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
